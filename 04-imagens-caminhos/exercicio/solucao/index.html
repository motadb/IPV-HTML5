    <h1>Galeria da Natureza</h1>
    <p>
        Uma coleção de fotografias que capturam a beleza da natureza portuguesa —
        da Serra da Estrela ao litoral alentejano.
    </p>

    <figure>
        <img src="https://picsum.photos/800/400?nature"
             alt="Vista panorâmica da Serra da Estrela ao amanhecer"
             width="800" height="400">
        <figcaption>Vista panorâmica da Serra da Estrela ao amanhecer. Foto: Maria Santos, outubro 2024.</figcaption>
    </figure>

    <h2>Galeria</h2>

    <figure>
        <img src="https://picsum.photos/300/200?random=1"
             alt="Cascata no interior de uma floresta de pinheiros"
             width="300" height="200">
        <figcaption>Cascata na floresta de pinheiros, Peneda-Gerês.</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/300/200?random=2"
             alt="Praia deserta ao entardecer com céu alaranjado"
             width="300" height="200">
        <figcaption>Praia de Odeceixe ao entardecer, Alentejo.</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/300/200?random=3"
             alt="Cegonha em cima de um ninho numa chaminé"
             width="300" height="200">
        <figcaption>Cegonha no seu ninho, Comporta, 2024.</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/300/200?random=4"
             alt="Montanha coberta de neve com céu azul limpo"
             width="300" height="200">
        <figcaption>Cume nevado da Serra da Estrela, janeiro 2024.</figcaption>
    </figure>
